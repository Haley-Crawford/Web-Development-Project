<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Music Style Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="player-container">
        <!-- Album Art and Song Info -->
        <div class="album-info">
            <img id="album-art" src="album-art.jpg" alt="Album Art">
            <h2 id="song-title">Song Title</h2>
            <p id="artist-name">Artist Name</p>
        </div>

        <!-- Time Labels and Progress Bar -->
        <div class="time-labels">
            <span id="current-time">0:00</span>
            <span id="duration-time">3:30</span>
        </div>
        <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">

        <!-- Audio Element -->
        <audio id="audio" src="your-song.mp3"></audio>

        <!-- Controls (Play/Pause and Volume) -->
        <div class="controls">
            <button id="play-pause" class="play-pause-btn">Play</button>
            <div class="volume-control">
                <label for="volumeBar">Volume</label>
                <input type="range" id="volumeBar" class="volume-bar" min="0" max="1" step="0.1" value="0.5">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
